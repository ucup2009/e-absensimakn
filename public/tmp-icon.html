<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        .wrap {
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(120% 120% at 20% 0%, #1a9b60 0%, #0d5c3a 55%, #073c27 100%);
        }
        .plate {
            width: 82%;
            height: 82%;
            border-radius: 26%;
            background: #ffffff;
            display: grid;
            place-items: center;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(0, 0, 0, .28);
        }
        img { width: 100%; height: 100%; object-fit: contain; }
        body.mask .plate { width: 68%; height: 68%; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="plate">
            <img src="/images/logo.png" alt="">
        </div>
    </div>
    <script>
        if (new URLSearchParams(location.search).has('mask')) {
            document.body.classList.add('mask');
        }
    </script>
</body>
</html>
