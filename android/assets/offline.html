<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidak terhubung — E-Absensi</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #eef4f0;
            color: #0f172a;
        }
        .card {
            width: min(360px, 100%);
            text-align: center;
            padding: 32px 24px;
            border-radius: 28px;
            background: rgba(255, 255, 255, .85);
            box-shadow: 0 24px 60px -28px rgba(15, 23, 42, .35);
        }
        .dot {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #b45309;
            background: rgba(251, 191, 36, .18);
            padding: 6px 12px;
            border-radius: 999px;
        }
        .dot span { width: 6px; height: 6px; border-radius: 999px; background: #f59e0b; }
        h1 { font-size: 21px; margin: 16px 0 6px; letter-spacing: -.02em; }
        p { margin: 0 auto; max-width: 280px; font-size: 13.5px; line-height: 1.6; color: #64748b; }
        button {
            margin-top: 16px;
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 16px;
            background: #0d5c3a;
            color: #fff;
            font: inherit;
            font-weight: 700;
            font-size: 14px;
        }
        button.secondary {
            background: #fff;
            color: #0d5c3a;
            border: 1px solid rgba(13, 92, 58, .25);
        }
        button:active { transform: scale(.98); }
        .server {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(13, 92, 58, .06);
            font-size: 11.5px;
            color: #0d5c3a;
            word-break: break-all;
            min-height: 18px;
        }
        .hint { margin-top: 12px; font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="dot"><span></span> Tidak ada koneksi</div>
        <h1>Server tidak terjangkau</h1>
        <p>Pastikan HP terhubung ke Wi-Fi madrasah dan server E-Absensi sedang menyala.</p>

        <div class="server" id="server-url">Memuat alamat…</div>

        <button type="button" onclick="if (window.EabsensiApp) { EabsensiApp.reload(); } else { location.reload(); }">Coba lagi</button>
        <button type="button" class="secondary" onclick="if (window.EabsensiApp) { EabsensiApp.openSettings(); }">Ganti alamat server</button>
        <p class="hint" id="version">E-Absensi MAKN Ende</p>
    </div>

    <script>
        // Tampilkan alamat server yang sedang dipakai aplikasi.
        try {
            if (window.EabsensiApp) {
                document.getElementById('server-url').textContent = EabsensiApp.getServerUrl();
                document.getElementById('version').textContent =
                    'E-Absensi MAKN Ende v' + EabsensiApp.getVersion();
            }
        } catch (e) {
            document.getElementById('server-url').textContent = '';
        }
    </script>
</body>
</html>
