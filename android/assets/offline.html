<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidak terhubung — E-Absensi</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #eef4f0;
            color: #0f172a;
        }
        .card {
            width: min(360px, 100%);
            text-align: center;
            padding: 32px 24px;
            border-radius: 28px;
            background: rgba(255, 255, 255, .85);
            box-shadow: 0 24px 60px -28px rgba(15, 23, 42, .35);
        }
        .dot {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #b45309;
            background: rgba(251, 191, 36, .18);
            padding: 6px 12px;
            border-radius: 999px;
        }
        .dot span { width: 6px; height: 6px; border-radius: 999px; background: #f59e0b; }
        h1 { font-size: 21px; margin: 16px 0 6px; letter-spacing: -.02em; }
        p { margin: 0 auto; max-width: 280px; font-size: 13.5px; line-height: 1.6; color: #64748b; }
        button {
            margin-top: 22px;
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 16px;
            background: #0d5c3a;
            color: #fff;
            font: inherit;
            font-weight: 700;
            font-size: 14px;
        }
        button:active { transform: scale(.98); }
        .hint { margin-top: 14px; font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="dot"><span></span> Tidak ada koneksi</div>
        <h1>Server tidak terjangkau</h1>
        <p>Pastikan HP terhubung ke Wi-Fi madrasah dan server E-Absensi sedang menyala.</p>
        <button type="button" onclick="if (window.EabsensiApp) { EabsensiApp.reload(); } else { location.reload(); }">Coba lagi</button>
        <p class="hint">E-Absensi MAKN Ende</p>
    </div>
</body>
</html>
